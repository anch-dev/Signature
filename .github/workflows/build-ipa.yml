name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets tagged builds attach the IPA to a GitHub Release

jobs:
  # audio.cpp (YuE2, experimental) for iOS. Optional: if it fails, the IPA is
  # built without on-device YuE2.
  audiocpp:
    runs-on: macos-15
    timeout-minutes: 90
    continue-on-error: true
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Cache AudioCpp.framework
        id: cache
        uses: actions/cache@v4
        with:
          path: ios/Frameworks/AudioCpp.framework
          key: audiocpp-${{ hashFiles('ios/scripts/build-audiocpp.sh') }}
      - name: Build audio.cpp for iOS
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p build
          if ! bash scripts/build-audiocpp.sh > build/audiocpp.log 2>&1; then
            grep -E "error:|Error |fatal error" build/audiocpp.log | sort -u | head -40 \
              | while IFS= read -r line; do echo "::error::${line:0:400}"; done || true
            tail -20 build/audiocpp.log | while IFS= read -r line; do echo "::error::tail: ${line:0:400}"; done
            exit 1
          fi
          tail -8 build/audiocpp.log
      - name: Upload framework
        uses: actions/upload-artifact@v4
        with:
          name: AudioCpp-framework
          path: ios/Frameworks/AudioCpp.framework

  ipa:
    needs: audiocpp
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, for the release changelog

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true; xcodebuild -version

      - name: Install tools
        run: brew install xcodegen ldid

      # The engine (acestep.cpp + ggml Metal) takes ~10 min to compile; cache it.
      - name: Cache engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: ios/Frameworks/AceEngine.xcframework
          key: engine-${{ hashFiles('ios/engine/**', 'ios/scripts/build-engine.sh', 'ios/scripts/fetch-acestep.sh') }}

      - name: Build engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p build
          if ! bash scripts/build-engine.sh > build/engine.log 2>&1; then
            grep -E "error:|Error |fatal error" build/engine.log | sort -u | head -40 \
              | while IFS= read -r line; do echo "::error::${line:0:400}"; done || true
            tail -20 build/engine.log | while IFS= read -r line; do echo "::error::tail: ${line:0:400}"; done
            exit 1
          fi
          tail -5 build/engine.log

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Signature.xcodeproj \
            -scheme Signature \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build/xcodebuild.log 2>&1 || true
          # Surface compiler errors as annotations (readable from the API and the run page).
          grep -E "^/.*: error: " build/xcodebuild.log | sort -u | head -60 | while IFS= read -r line; do
            f=$(echo "$line" | cut -d: -f1 | sed "s#^$PWD/##"); l=$(echo "$line" | cut -d: -f2)
            msg=$(echo "$line" | cut -d: -f5- | sed 's/^ *//')
            echo "::error file=ios/$f,line=$l::$msg"
          done || true
          # Linker and other non-file errors.
          grep -E "(^ld: |Undefined symbol|^error: |clang: error|: fatal error)" build/xcodebuild.log \
            | sort -u | head -30 | while IFS= read -r line; do echo "::error::${line:0:400}"; done || true
          if ! grep -q "BUILD SUCCEEDED" build/xcodebuild.log; then
            grep -nE " error: |BUILD FAILED|failed with exit code" build/xcodebuild.log | tail -25 \
              | while IFS= read -r line; do echo "::error::${line:0:400}"; done || true
            tail -15 build/xcodebuild.log | while IFS= read -r line; do echo "::error::tail: ${line:0:400}"; done
          fi
          test -d build/dd/Build/Products/Release-iphoneos/Signature.app

      - name: Get AudioCpp.framework (optional)
        id: audiocpp
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: AudioCpp-framework
          path: ios/build/AudioCpp.framework

      - name: Package IPA
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/Signature.app
          if [ -f build/AudioCpp.framework/AudioCpp ]; then
            mkdir -p "$APP/Frameworks"
            rm -rf "$APP/Frameworks/AudioCpp.framework"
            cp -R build/AudioCpp.framework "$APP/Frameworks/AudioCpp.framework"
            ldid -S "$APP/Frameworks/AudioCpp.framework/AudioCpp"
            echo "On-device YuE2 included ($(du -h "$APP/Frameworks/AudioCpp.framework/AudioCpp" | cut -f1))"
          else
            echo "::warning::AudioCpp.framework not built; IPA has no on-device YuE2"
          fi
          # Fail loudly if the on-device engine didn't make it into the binary.
          ls -lh "$APP/Signature"
          strings "$APP/Signature" | grep -q "Synth-Load" || { echo "::error::acestep engine missing from app binary"; exit 1; }
          strings "$APP/Signature" | grep -q "kernel_mul_mm" || { echo "::error::Metal kernels missing from app binary"; exit 1; }
          echo "Engine and Metal kernels present"
          # Fake-sign so the increased-memory-limit entitlement travels with the
          # binary; SideStore/AltStore re-sign it with your Apple ID on install.
          ldid -SSignature/Signature.entitlements "$APP/Signature"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry ../Signature.ipa Payload
          ls -lh ../Signature.ipa

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build/xcodebuild.log
          if-no-files-found: ignore

      # Raw .ipa, not zipped (archive: false): downloads as Signature.ipa.
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          path: Signature.ipa
          archive: false

      # Rolling "latest" release with the raw .ipa: one stable link to download
      # straight from Safari / SideStore (no artifact zip to unpack).
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          # Changelog: commit subjects and their "- " detail lines since the
          # previous latest build (trailers dropped).
          PREV=$(git rev-list -n 1 latest 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}$GITHUB_SHA
          [ -n "$PREV" ] || RANGE="-n 10 $GITHUB_SHA"
          {
            echo "## Changes"
            git log --no-merges --format='%x1e%s%n%b' $RANGE | awk '
              /^\x1e/ { sub(/^\x1e/, ""); print "- **" $0 "**"; inb = 0; next }
              /^- / { print "  " $0; inb = 1; next }
              inb && /^  [^ ]/ { print "  " $0; next }
              { inb = 0 }'
            echo
            echo "Commit ${GITHUB_SHA::7}."
          } > notes.md
          cat notes.md
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest Signature.ipa \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build ($(date -u +%Y-%m-%d) · ${GITHUB_SHA::7})" \
            --notes-file notes.md

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Signature.ipa
